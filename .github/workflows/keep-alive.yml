name: Render Backend Keep-Alive

on:
  schedule:
    # Pings Render every 14 minutes to prevent free-tier spin-down
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allows manual one-click wake-up from GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Live API
        run: |
          echo "Pinging Ankelba Render API..."
          curl -s -i https://ankelba-api.onrender.com/api || true
